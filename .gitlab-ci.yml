
stages:
  - run_tests
  - image
  - script

run_tests:
  stage: run_test
  image: node:18-alpine
  script:
    - npm ci
    - npm test

build_app:
  stage: build_app
  script:
    - npm run build
  artifacts:
    paths:
      - dist/                     
    expire_in: ...
  only:
    - ...
    - ...

deploy_staging:
  stage: deploy_staging
  script:
    - echo "Deploying to staging..."
  when: manual
  only:
    - develop
